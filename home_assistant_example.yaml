# ============================================
# TIPS
# ============================================

# 1. Entity names are based on what you enter when learning RF codes
#    Example: If you name it "Doorbell" → binary_sensor.rf_doorbell
#
# 2. RF triggers auto-reset after 2 seconds
#    They act like momentary buttons, not toggle switches
#
# 3. Use "to: on" in triggers (not "from: off")
#    The trigger is the ON state, OFF happens automatically
#
# 4. You can have up to 10 different RF codes learned
#    Each creates its own binary_sensor entity
#
# 5. RF codes persist across reboots
#    No need to re-learn after power cycle
