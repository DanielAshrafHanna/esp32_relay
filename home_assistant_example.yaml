# Home Assistant Configuration Example
# ESP32 RF-to-MQTT Bridge
# Add relevant sections to your configuration.yaml

# MQTT Configuration (if not already configured)
mqtt:
  broker: 192.168.1.100  # Change to your MQTT broker IP
  port: 1883
  username: YOUR_MQTT_USERNAME  # Optional
  password: YOUR_MQTT_PASSWORD  # Optional
  discovery: true
  discovery_prefix: homeassistant

# Note: RF triggers are auto-discovered via MQTT
# No manual configuration needed for binary sensors
# Just learn RF codes via the web interface

# ============================================
# EXAMPLE AUTOMATIONS FOR RF TRIGGERS
# ============================================

# Example 1: Doorbell Notification
automation:
  - alias: "RF Doorbell Alert"
    description: "Send notification when doorbell RF signal received"
    trigger:
      - platform: state
        entity_id: binary_sensor.rf_doorbell
        to: "on"
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "🔔 Doorbell"
          message: "Someone is at the door!"
      - service: light.turn_on
        target:
          entity_id: light.porch
        data:
          brightness_pct: 100

  # Example 2: Panic Button
  - alias: "RF Panic Button Alert"
    description: "Emergency alert when panic button pressed"
    trigger:
      - platform: state
        entity_id: binary_sensor.rf_panic_button
        to: "on"
    action:
      - service: notify.all_devices
        data:
          title: "🚨 EMERGENCY"
          message: "Panic button has been pressed!"
      - service: scene.turn_on
        target:
          entity_id: scene.all_lights_on

  # Example 3: Scene Activation via RF Remote
  - alias: "RF Remote - Movie Mode"
    description: "Activate movie scene when RF button 1 pressed"
    trigger:
      - platform: state
        entity_id: binary_sensor.rf_remote_1
        to: "on"
    action:
      - service: scene.turn_on
        target:
          entity_id: scene.movie_mode

  # Example 4: Toggle Light with RF
  - alias: "RF Remote - Toggle Living Room Light"
    description: "Toggle light when RF button 2 pressed"
    trigger:
      - platform: state
        entity_id: binary_sensor.rf_remote_2
        to: "on"
    action:
      - service: light.toggle
        target:
          entity_id: light.living_room

  # Example 5: Garage Door Alert
  - alias: "RF Garage Door Opened"
    description: "Alert when garage door RF signal detected"
    trigger:
      - platform: state
        entity_id: binary_sensor.rf_garage
        to: "on"
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "🚗 Garage"
          message: "Garage door has been activated"

  # Example 6: Motion Sensor Integration
  - alias: "RF Motion Sensor - Turn On Lights"
    description: "Turn on lights when RF motion sensor triggered"
    trigger:
      - platform: state
        entity_id: binary_sensor.rf_motion_sensor
        to: "on"
    condition:
      - condition: state
        entity_id: sun.sun
        state: "below_horizon"
    action:
      - service: light.turn_on
        target:
          entity_id: light.hallway

# ============================================
# EXAMPLE SCENES
# ============================================

scene:
  - name: Movie Mode
    entities:
      light.living_room:
        state: off
      light.ambient:
        state: on
        brightness_pct: 20
      media_player.tv:
        state: on

  - name: All Lights On
    entities:
      light.living_room:
        state: on
        brightness_pct: 100
      light.bedroom:
        state: on
        brightness_pct: 100
      light.kitchen:
        state: on
        brightness_pct: 100

# ============================================
# EXAMPLE SCRIPTS
# ============================================

script:
  rf_doorbell_sequence:
    alias: "Doorbell Sequence"
    sequence:
      - service: media_player.play_media
        target:
          entity_id: media_player.living_room_speaker
        data:
          media_content_id: "media-source://media_source/local/doorbell.mp3"
          media_content_type: "music"
      - service: light.turn_on
        target:
          entity_id: light.porch
      - delay:
          minutes: 5
      - service: light.turn_off
        target:
          entity_id: light.porch

